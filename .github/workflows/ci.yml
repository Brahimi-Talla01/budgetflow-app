name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installe les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript + Vite)
        run: npm run build

  backend:
    name: Backend (compile + démarrage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///ci.db
      JWT_SECRET_KEY: ci-secret-key
    steps:
      - name: Récupère le dépôt
        uses: actions/checkout@v4

      - name: Installe Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      - name: Compile les modules Python
        run: python -m compileall -q app

      - name: Vérifie que l'application Flask se charge
        run: python -c "from app import create_app; app = create_app(); assert app.url_map.iter_rules(), 'aucune route enregistrée'; print('Application Flask chargée')"
